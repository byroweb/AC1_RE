<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC1 Plant View</title>
<style>
  :root {
    --bg: #11151c; --surface: #1b2129; --surface-2: #232b36; --line: #36404d;
    --text: #e6e9ee; --muted: #8b95a3; --accent: #3fb68b; --accent-2: #e0a84a;
    --danger: #e06060; --info: #5aa0e6; --confirmed: #3fb68b; --hypothesis: #e0a84a;
    --token: #ffd166; --pipe: #4a5563;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f8; --surface: #ffffff; --surface-2: #e9edf2; --line: #c9d1dc;
      --text: #1a1f26; --muted: #5f6b7a; --pipe: #9aa6b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .kv { display: flex; flex-direction: column; min-width: 70px; }
  .kv .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 10px; font-weight: 700;
    letter-spacing: .03em; color: #0d1117; }
  .pill.C { background: var(--confirmed); } .pill.H { background: var(--hypothesis); }
  .pill.live { background: var(--danger); color: #fff; } .pill.replay { background: var(--info); color: #fff; }
  .gauge { width: 140px; height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .gauge > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #stage { position: relative; min-width: 0; overflow: auto; padding: 8px; }
  canvas { display: block; width: max(100%, 1180px); height: auto; }
  aside { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 8px 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  td, th { padding: 2px 4px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }
  td.mono { font-family: ui-monospace, Consolas, monospace; }
  tr.off td { color: var(--muted); }
  tr.dead td { color: var(--danger); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--line); }
  .dot.on { background: var(--accent); }
  footer { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--surface); }
  footer input[type=range] { flex: 1; }
  button { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 10px; cursor: pointer; font: inherit; }
  button.on { background: var(--accent); color: #0d1117; border-color: var(--accent); }
  #note { font-size: 11px; color: var(--muted); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>AC1 plant view</h1>
  <span id="src" class="pill replay">…</span>
  <div class="kv"><span class="k">lifecycle</span><span class="v" id="h-lc">—</span></div>
  <div class="kv"><span class="k">mission</span><span class="v" id="h-mission">—</span></div>
  <div class="kv"><span class="k">mode byte</span><span class="v" id="h-mode">—</span></div>
  <div class="kv"><span class="k">frame</span><span class="v" id="h-frame">—</span></div>
  <div class="kv"><span class="k">entities</span><span class="v" id="h-ents">—</span></div>
  <div class="kv"><span class="k">flags</span><span class="v" id="h-flags">—</span></div>
  <div class="kv"><span class="k">player AP</span><span class="v" id="h-ap">—</span><div class="gauge"><i id="g-ap"></i></div></div>
  <div class="kv"><span class="k">end counter</span><span class="v" id="h-end">—</span><div class="gauge"><i id="g-end"></i></div></div>
  <div class="kv"><span class="k">read</span><span class="v" id="h-read">—</span></div>
  <span id="note"></span>
</header>
<main>
  <div id="stage"><canvas id="c"></canvas></div>
  <aside>
    <h2>Fields <span class="pill C">confirmed</span> <span class="pill H">hypothesis</span></h2>
    <table id="t-fields"><thead><tr><th>field</th><th>addr</th><th>value</th><th></th></tr></thead><tbody></tbody></table>
    <h2>Entity slots (0x801A26B8, stride 0x170)</h2>
    <table id="t-ents"><thead><tr><th></th><th>#</th><th>tmpl</th><th>AP</th><th>team</th><th>st</th><th>think</th><th>x,y,z</th></tr></thead><tbody></tbody></table>
  </aside>
</main>
<footer>
  <button id="b-live" class="on">LIVE</button>
  <button id="b-play">▶ play</button>
  <button id="b-prev">◀</button>
  <button id="b-next">▶</button>
  <input id="scrub" type="range" min="0" max="0" value="0">
  <span id="s-label" style="min-width:260px;font-variant-numeric:tabular-nums"></span>
</footer>
<script>
(() => {
const $ = id => document.getElementById(id);
const hex = (v, w = 8) => v == null ? '—' : '0x' + (v >>> 0).toString(16).toUpperCase().padStart(w, '0');
let layout = null, samples = [], shown = null, prevShown = null, live = true, playing = false, info = {};
const stations = {}, tokens = [], pulses = {};
let W = 1200, H = 600, dpr = 1;
const canvas = $('c'), ctx = canvas.getContext('2d');

// ------------------------------------------------------------ geometry
function buildGeometry() {
  const g = layout.grid, m = 24;
  W = g.cols * g.cell_w + 2 * m; H = g.rows * g.cell_h + 2 * m;
  const widths = { lifecycle: 1.65, entity: 2.1, frame: 1.6 };
  for (const s of layout.stations) {
    const w = g.cell_w * (widths[s.group] || 1.6), h = g.cell_h * 0.78;
    s.rect = { x: m + s.col * g.cell_w, y: m + s.row * g.cell_h + 14, w, h };
    stations[s.id] = s;
  }
  for (const t of layout.transitions) {
    const a = stations[t.from].rect, b = stations[t.to].rect;
    const bend = t.bend || 0;
    if (!bend && b.x > a.x) {
      t.path = [[a.x + a.w, a.y + a.h / 2], [b.x, b.y + b.h / 2]];
    } else {
      const lane = bend >= 0 ? a.y + a.h + 26 : a.y - 20;
      const ya = bend >= 0 ? a.y + a.h : a.y, yb = bend >= 0 ? b.y + b.h : b.y;
      t.path = [[a.x + a.w * 0.6, ya], [a.x + a.w * 0.6, lane], [b.x + b.w * 0.4, lane], [b.x + b.w * 0.4, yb]];
    }
    t.len = 0; t.seg = [];
    for (let i = 1; i < t.path.length; i++) {
      const d = Math.hypot(t.path[i][0] - t.path[i - 1][0], t.path[i][1] - t.path[i - 1][1]);
      t.seg.push(d); t.len += d;
    }
  }
  resize();
}
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.aspectRatio = `${W} / ${H}`;
}
function pointAt(t, u) {
  let d = u * t.len;
  for (let i = 0; i < t.seg.length; i++) {
    if (d <= t.seg[i] || i === t.seg.length - 1) {
      const k = t.seg[i] ? Math.min(1, d / t.seg[i]) : 1;
      const p = t.path[i], q = t.path[i + 1];
      return [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
    }
    d -= t.seg[i];
  }
  return t.path[t.path.length - 1];
}

// ------------------------------------------------------------ sample → station state
function fieldVal(s, name) { return s && s.fields ? s.fields[name] : null; }
function counterOf(s, st) {
  if (!st.counter || !s) return null;
  const d = s.derived || {};
  const v = typeof st.counter.value === 'number' ? st.counter.value : d[st.counter.value];
  const of = typeof st.counter.of === 'number' ? st.counter.of : d[st.counter.of];
  return { v: v ?? 0, of: of ?? 0 };
}
function isActive(s, st) {
  if (!s || !st.active_when) return false;
  if (st.active_when.lifecycle) return s.derived.lifecycle === st.active_when.lifecycle;
  if (st.active_when.counter_gt != null) { const c = counterOf(s, st); return c && c.v > st.active_when.counter_gt; }
  return false;
}
function findTransition(from, to) { return layout.transitions.find(t => t.from === from && t.to === to); }
function emit(t, color, dur) { if (t) tokens.push({ t, t0: performance.now(), dur: dur || 900, color: color || 'var(--token)' }); }
function pulse(id) { pulses[id] = performance.now(); }

function diffAndAnimate(prev, cur) {
  if (!cur) return;
  const d = cur.derived, p = prev ? prev.derived : null;
  if (!p) { pulse(stationFor(d.lifecycle)); return; }
  if (p.lifecycle !== d.lifecycle) {
    const t = findTransition(p.lifecycle, d.lifecycle);
    if (t) emit(t, '#ffd166', 1100); else pulse(d.lifecycle);
    pulse(d.lifecycle);
  }
  if (d.templates_consumed > p.templates_consumed || d.entities_active > p.entities_active) { emit(findTransition('SPAWN', 'UPDATE'), '#5aa0e6'); pulse('UPDATE'); }
  if (d.entities_dead > p.entities_dead) { emit(findTransition('COLLISION', 'DESTROY'), '#e06060'); pulse('DESTROY'); }
  if (d.entities_active < p.entities_active) { emit(findTransition('DESTROY', 'SPAWN'), '#8b95a3'); }
  const pAp = (prev.entities || []).reduce((a, e) => a + (e.active ? e.ap : 0), 0);
  const cAp = (cur.entities || []).reduce((a, e) => a + (e.active ? e.ap : 0), 0);
  if (d.entities_active > 0 && cAp < pAp) emit(findTransition('UPDATE', 'COLLISION'), '#e0a84a', 700);
}
function stationFor(lc) { return lc; }

// ------------------------------------------------------------ drawing
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
let frameTokenAt = 0;
function draw(now) {
  if (!layout) { requestAnimationFrame(draw); return; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const C = { surface: css('--surface'), s2: css('--surface-2'), line: css('--line'), text: css('--text'), muted: css('--muted'),
              accent: css('--accent'), pipe: css('--pipe'), conf: css('--confirmed'), hyp: css('--hypothesis'), danger: css('--danger') };
  const s = shown, lc = s ? s.derived.lifecycle : null;
  // group captions
  ctx.font = '600 11px system-ui, sans-serif'; ctx.fillStyle = C.muted; ctx.textBaseline = 'alphabetic';
  const g = layout.grid, m = 24;
  const cap = (row, txt) => ctx.fillText(txt, m, m + row * g.cell_h + 8);
  cap(0, 'MISSION LIFECYCLE  (MISSION_STATE_MACHINE.md §2 §5 §6)');
  cap(2, 'ENTITY TABLE  (§7, ENTITY_AI_FRAMEWORK.md)');
  cap(4, 'PER-FRAME PIPELINE  (§4 order; illustrative — no live probe yet)');
  // pipes
  for (const t of layout.transitions) {
    ctx.strokeStyle = C.pipe; ctx.lineWidth = 2; ctx.setLineDash(t.status === 'HYPOTHESIS' ? [5, 4] : []);
    ctx.beginPath(); t.path.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.setLineDash([]);
    const e = t.path[t.path.length - 1], f = t.path[t.path.length - 2];
    const ang = Math.atan2(e[1] - f[1], e[0] - f[0]);
    ctx.fillStyle = C.pipe; ctx.beginPath(); ctx.moveTo(e[0], e[1]);
    ctx.lineTo(e[0] - 9 * Math.cos(ang - .45), e[1] - 9 * Math.sin(ang - .45));
    ctx.lineTo(e[0] - 9 * Math.cos(ang + .45), e[1] - 9 * Math.sin(ang + .45)); ctx.fill();
    if (t.label) {
      const mid = pointAt(t, 0.5);
      ctx.font = '10px system-ui, sans-serif'; ctx.fillStyle = C.muted; ctx.textAlign = 'center';
      const lift = t.path.length > 2 ? 12 : -6;
      ctx.fillText(t.label, mid[0], mid[1] + lift); ctx.textAlign = 'left';
    }
  }
  // stations
  for (const st of layout.stations) {
    const r = st.rect, act = isActive(s, st), isFrame = st.group === 'frame';
    const pt = pulses[st.id] ? Math.max(0, 1 - (now - pulses[st.id]) / 900) : 0;
    ctx.save();
    if (pt > 0) { ctx.shadowColor = C.accent; ctx.shadowBlur = 24 * pt; }
    roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = act ? C.accent : (isFrame ? 'transparent' : C.surface);
    ctx.fill(); ctx.restore();
    roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.strokeStyle = act ? C.accent : C.line; ctx.lineWidth = act ? 2 : 1;
    ctx.setLineDash(isFrame ? [4, 3] : []); ctx.stroke(); ctx.setLineDash([]);
    const fg = act ? '#0d1117' : C.text, mu = act ? '#0d1117' : C.muted;
    ctx.fillStyle = fg; ctx.font = '600 12px system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.fillText(st.label, r.x + 10, r.y + 8);
    // status badge
    ctx.fillStyle = st.status === 'CONFIRMED' ? C.conf : C.hyp;
    roundRect(r.x + r.w - 22, r.y + 7, 14, 14, 4); ctx.fill();
    ctx.fillStyle = '#0d1117'; ctx.font = '700 9px system-ui, sans-serif';
    ctx.fillText(st.status === 'CONFIRMED' ? 'C' : 'H', r.x + r.w - 18, r.y + 10);
    let y = r.y + 26;
    const c = counterOf(s, st);
    if (c) {
      ctx.fillStyle = fg; ctx.font = '700 22px system-ui, sans-serif';
      ctx.fillText(`${c.v} / ${c.of}`, r.x + 10, y);
      ctx.fillStyle = mu; ctx.font = '10px system-ui, sans-serif'; ctx.fillText(st.counter.label, r.x + 10, y + 26);
      // bar
      const bw = r.w - 20, k = c.of ? Math.min(1, c.v / c.of) : 0;
      ctx.fillStyle = act ? 'rgba(13,17,23,.25)' : C.s2; ctx.fillRect(r.x + 10, r.y + r.h - 10, bw, 5);
      ctx.fillStyle = act ? '#0d1117' : C.accent; ctx.fillRect(r.x + 10, r.y + r.h - 10, bw * k, 5);
      y += 40;
    }
    for (const gz of st.gauges || []) {
      const v = fieldVal(s, gz.field), k = v == null ? 0 : Math.max(0, Math.min(1, (v - gz.min) / (gz.max - gz.min)));
      ctx.fillStyle = mu; ctx.font = '10px system-ui, sans-serif'; ctx.fillText(`${gz.label}: ${v ?? '—'}`, r.x + 10, y);
      ctx.fillStyle = act ? 'rgba(13,17,23,.25)' : C.s2; ctx.fillRect(r.x + 10, y + 12, r.w - 20, 5);
      ctx.fillStyle = act ? '#0d1117' : C.accent; ctx.fillRect(r.x + 10, y + 12, (r.w - 20) * k, 5);
      y += 22;
    }
    if (!c) {
      ctx.font = '10.5px ui-monospace, Consolas, monospace';
      for (const fname of (st.fields || []).slice(0, 3)) {
        const f = layout.fields[fname], v = fieldVal(s, fname);
        if (!f) continue;
        ctx.fillStyle = mu; ctx.fillText(`${f.label}`, r.x + 10, y);
        ctx.fillStyle = fg; ctx.textAlign = 'right';
        ctx.fillText(v == null ? '—' : (f.type === 'u32' && v > 0xFFFF ? hex(v) : String(v)), r.x + r.w - 10, y);
        ctx.textAlign = 'left'; y += 13;
      }
      if (isFrame) { ctx.fillStyle = C.muted; ctx.font = '10px system-ui, sans-serif'; ctx.fillText('no live field yet', r.x + 10, y); }
    }
  }
  // tokens
  for (let i = tokens.length - 1; i >= 0; i--) {
    const tk = tokens[i], u = (now - tk.t0) / tk.dur;
    if (u >= 1) { tokens.splice(i, 1); continue; }
    const p = pointAt(tk.t, u);
    ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI * 2); ctx.fillStyle = tk.color; ctx.fill();
    ctx.strokeStyle = '#0d1117'; ctx.lineWidth = 1; ctx.stroke();
  }
  // per-frame marching token (illustrative: the §4 order), only while a mission runs
  if (s && s.derived.in_mission && (live || playing) && now - frameTokenAt > 1500) {
    frameTokenAt = now;
    const chain = ['PH_DRIVER', 'PH_TIMER', 'PH_VM', 'PH_ENTITIES', 'PH_PROJ', 'PH_HUD'];
    for (let i = 1; i < chain.length; i++) {
      const t = findTransition(chain[i - 1], chain[i]);
      if (t) tokens.push({ t, t0: now + (i - 1) * 230, dur: 230, color: '#8b95a3' });
    }
  }
  requestAnimationFrame(draw);
}

// ------------------------------------------------------------ panels
function updatePanels(s) {
  const d = s ? s.derived : {}, f = s ? s.fields : {};
  $('h-lc').textContent = d.lifecycle || '—';
  $('h-mission').textContent = f.mission_no ?? '—';
  $('h-mode').textContent = f.game_mode ?? '—';
  $('h-frame').textContent = s && s.frame != null ? s.frame : '—';
  $('h-ents').textContent = s ? `${d.entities_active} live · ${d.entities_dead} dead · ${d.templates_consumed}/${d.templates_total} tmpl` : '—';
  $('h-flags').textContent = s ? `${hex(f.flags, 4)} ${d.flag_names.join(',')}` : '—';
  $('h-ap').textContent = d.player_ap != null ? `${d.player_ap} / ${d.player_ap_max}  (HUD ${Math.floor(d.player_ap / 4)})` : '—';
  $('g-ap').style.width = d.player_ap_max ? (100 * d.player_ap / d.player_ap_max) + '%' : '0';
  $('h-end').textContent = f.end_counter ?? '—';
  $('g-end').style.width = f.end_counter != null ? f.end_counter + '%' : '0';
  $('h-read').textContent = s && s.read_ms != null ? s.read_ms + ' ms' : (s && s.label ? s.label : '—');
  const tb = $('t-fields').tBodies[0]; tb.innerHTML = '';
  for (const [name, fd] of Object.entries(layout.fields)) {
    const v = f[name], tr = tb.insertRow();
    tr.title = (fd.doc || '') + (fd.note ? ' — ' + fd.note : '');
    tr.insertCell().textContent = fd.label || name;
    const a = tr.insertCell(); a.textContent = fd.addr; a.className = 'mono';
    const c = tr.insertCell(); c.className = 'num';
    c.textContent = v == null ? '—' : (fd.type === 'u32' && v > 0xFFFF ? hex(v) : `${v} (${hex(v, 2)})`);
    const p = tr.insertCell(); p.innerHTML = `<span class="pill ${fd.status === 'CONFIRMED' ? 'C' : 'H'}">${fd.status === 'CONFIRMED' ? 'C' : 'H'}</span>`;
  }
  const te = $('t-ents').tBodies[0]; te.innerHTML = '';
  for (const e of (s ? s.entities : [])) {
    const tr = te.insertRow(); tr.className = e.active ? (e.ap === 0 ? 'dead' : '') : 'off';
    tr.insertCell().innerHTML = `<span class="dot ${e.active ? 'on' : ''}"></span>`;
    tr.insertCell().textContent = e.slot;
    tr.insertCell().textContent = e.template_idx ?? '—';
    const ap = tr.insertCell(); ap.className = 'num'; ap.textContent = e.active ? `${e.ap}/${e.ap_max}` : '—';
    tr.insertCell().textContent = e.active ? (e.faction & 7) : '—';
    tr.insertCell().textContent = e.active ? hex(e.ai_state, 2) : '—';
    const th = tr.insertCell(); th.className = 'mono'; th.textContent = e.active ? hex(e.think) : '—';
    tr.insertCell().textContent = e.active ? `${e.pos_x},${e.pos_y},${e.pos_z}` : '—';
  }
}
function show(s, animate = true) {
  if (!s) return;
  prevShown = shown; shown = s;
  if (animate) diffAndAnimate(prevShown, s);
  updatePanels(s);
  const idx = samples.indexOf(s);
  if (idx >= 0) { $('scrub').max = Math.max(0, samples.length - 1); $('scrub').value = idx; }
  $('s-label').textContent = `#${s.seq} · ${s.label || s.source || ''} · ${idx + 1}/${samples.length}` + (s.frame != null ? ` · frame ${s.frame}` : '');
}

// ------------------------------------------------------------ transport
function setLive(on) {
  live = on; $('b-live').classList.toggle('on', on);
  if (on) { playing = false; $('b-play').classList.remove('on'); if (samples.length) show(samples[samples.length - 1]); }
}
$('b-live').onclick = () => setLive(!live);
$('scrub').oninput = ev => { live = false; $('b-live').classList.remove('on'); show(samples[+ev.target.value]); };
$('b-prev').onclick = () => { const i = samples.indexOf(shown); if (i > 0) { live = false; $('b-live').classList.remove('on'); show(samples[i - 1]); } };
$('b-next').onclick = () => { const i = samples.indexOf(shown); if (i < samples.length - 1) { live = false; $('b-live').classList.remove('on'); show(samples[i + 1]); } };
$('b-play').onclick = () => { playing = !playing; $('b-play').classList.toggle('on', playing); if (playing) { live = false; $('b-live').classList.remove('on'); } };
setInterval(() => {
  if (!playing) return;
  const i = samples.indexOf(shown);
  if (i < samples.length - 1) show(samples[i + 1]); else { playing = false; $('b-play').classList.remove('on'); }
}, 1000 / 4);
document.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowLeft') $('b-prev').click(); else if (ev.key === 'ArrowRight') $('b-next').click();
  else if (ev.key === ' ') { ev.preventDefault(); $('b-play').click(); } else if (ev.key === 'l') setLive(true);
});

// ------------------------------------------------------------ data
async function boot() {
  layout = await (await fetch('stations.json')).json();
  buildGeometry();
  try { info = await (await fetch('/info')).json(); } catch (e) { info = {}; }
  $('src').textContent = info.source || 'static'; $('src').className = 'pill ' + (info.source === 'live' ? 'live' : 'replay');
  $('note').textContent = info.source === 'live' ? 'DuckStation MCP read_memory; scrub to pause' : 'replay — use the scrubber, ▶ or ←/→';
  try { samples = await (await fetch('/history?since=0')).json(); } catch (e) { samples = []; }
  $('scrub').max = Math.max(0, samples.length - 1);
  if (samples.length) show(samples[samples.length - 1], false);
  if (!info.source) return;        // opened as a file: nothing to stream
  const es = new EventSource('/events');
  es.onmessage = ev => {
    const s = JSON.parse(ev.data);
    if (samples.length && samples[samples.length - 1].seq >= s.seq) return;
    samples.push(s); $('scrub').max = samples.length - 1;
    if (live) show(s); else $('s-label').textContent += '';
  };
  es.onerror = () => { $('note').textContent = 'stream disconnected — poller stopped?'; };
}
window.addEventListener('resize', resize);
boot(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
